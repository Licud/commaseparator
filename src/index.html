<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:           #131110;
            --surface:      #1c1917;
            --surface-2:    #232019;
            --border:       #2e2a26;
            --text:         #e8ddd3;
            --text-muted:   #7a6f68;
            --accent:       #d4785a;
            --accent-hover: #bf6548;
            --accent-dim:   rgba(212, 120, 90, 0.1);
            --green:        #7dc4a2;
            --green-dim:    rgba(125, 196, 162, 0.1);
            --red:          #c96b68;
            --red-dim:      rgba(201, 107, 104, 0.1);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            min-height: 100vh;
        }

        /* ── Top nav ── */
        .topbar {
            padding: 28px 40px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-end;
            gap: 0;
        }

        .topbar h1 {
            font-family: 'Lora', Georgia, serif;
            font-size: 22px;
            font-weight: 400;
            color: var(--text);
            margin-right: 32px;
            padding-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 16px;
            cursor: pointer;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
            letter-spacing: 0.01em;
        }

        .tab-btn:hover { color: var(--text); }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ── Page content ── */
        .page {
            display: none;
            padding: 32px 40px;
        }

        .page.active { display: block; }

        /* ── Form ── */
        .add-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .field input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .field input:focus { border-color: var(--accent); }

        .field-credit {
            justify-content: flex-end;
            padding-bottom: 9px;
        }

        .field-credit label {
            font-size: 14px;
            color: var(--text);
            text-transform: none;
            letter-spacing: normal;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .field-credit input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .field-amount { position: relative; }

        .field-amount .pound-sign {
            position: absolute;
            bottom: 9px;
            left: 10px;
            color: var(--text-muted);
            pointer-events: none;
            font-size: 13px;
        }

        .field-amount input  { padding-left: 22px; width: 110px; }
        .field-category input { width: 160px; }
        .field-notes input   { width: 200px; }
        .field-date input    { width: 150px; }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
            transition: background 0.15s;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 13px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }

        .btn:hover { color: var(--text); border-color: #4a4540; }

        .btn-danger:hover { color: var(--red); border-color: var(--red); }

        .copy-confirm {
            font-size: 12px;
            color: var(--green);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .copy-confirm.visible { opacity: 1; }

        /* ── Table ── */
        .table-wrapper {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead { background: var(--surface); }

        th {
            text-align: left;
            padding: 11px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--surface); }

        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-yes { background: var(--green-dim); color: var(--green); }
        .badge-no  { background: var(--surface-2); color: var(--text-muted); }

        .col-amount { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 500; }

        .btn-delete {
            background: none;
            border: none;
            color: var(--border);
            cursor: pointer;
            padding: 3px 7px;
            font-size: 16px;
            line-height: 1;
            transition: color 0.15s;
        }

        .btn-delete:hover { color: var(--red); }

        .empty-row td {
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Balance tab ── */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .balance-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .balance-panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .balance-panel-header h2 {
            font-family: 'Lora', Georgia, serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
        }

        .balance-panel-header span {
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
        }

        .balance-add-row {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .balance-add-row input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 7px 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
            flex: 1;
        }

        .balance-add-row input:focus { border-color: var(--accent); }

        .balance-add-row .amount-wrap {
            position: relative;
            flex: 0 0 110px;
        }

        .balance-add-row .amount-wrap .pound-sign {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 13px;
        }

        .balance-add-row .amount-wrap input { padding-left: 22px; width: 100%; }

        .btn-add-small {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .btn-add-small:hover { background: var(--accent-hover); }

        .balance-list { list-style: none; }

        .balance-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .balance-list li:last-child { border-bottom: none; }

        .balance-list .item-name { color: var(--text); }

        .balance-list .item-amount {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: var(--accent);
        }

        .balance-list .item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-empty {
            padding: 24px 16px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
        }

        /* ── Summary card ── */
        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 24px;
            max-width: 360px;
        }

        .summary-card h2 {
            font-family: 'Lora', Georgia, serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            font-size: 14px;
        }

        .summary-row .label { color: var(--text-muted); }

        .summary-row .value {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .summary-row .value.positive { color: var(--green); }
        .summary-row .value.negative { color: var(--red); }
        .summary-row .value.neutral  { color: var(--accent); }

        .summary-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 0 0;
        }

        .summary-total .label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .summary-total .value {
            font-size: 20px;
            font-family: 'Lora', serif;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .spreadsheet-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .pound-sign-inline {
            position: absolute;
            left: 8px;
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .spreadsheet-input-wrap input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 5px 8px 5px 22px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            width: 120px;
            outline: none;
            transition: border-color 0.15s;
            text-align: right;
        }

        .spreadsheet-input-wrap input:focus { border-color: var(--accent); }
    </style>
</head>
<body>

<div class="topbar">
    <h1>Expense Tracker</h1>
    <button class="tab-btn active" onclick="switchTab('expenses')">Expenses</button>
    <button class="tab-btn" onclick="switchTab('balance')">Balance</button>
</div>

<!-- ── Expenses tab ── -->
<div class="page active" id="page-expenses">

    <div class="add-form">
        <div class="field field-credit">
            <label>
                <input type="checkbox" id="input-credit">
                Credit
            </label>
        </div>

        <div class="field field-category">
            <label>Category</label>
            <input list="categories" id="input-category" placeholder="Pick or type…">
            <datalist id="categories">
                <option value="Eating Out">
                <option value="Grocery">
                <option value="Travel">
                <option value="Gaming">
                <option value="Bills">
                <option value="Shopping">
                <option value="Car">
            </datalist>
        </div>

        <div class="field field-amount">
            <label>Amount</label>
            <span class="pound-sign">£</span>
            <input type="number" id="input-amount" min="0" step="0.01" placeholder="0.00">
        </div>

        <div class="field field-date">
            <label>Date</label>
            <input type="date" id="input-date">
        </div>

        <div class="field field-notes">
            <label>Notes</label>
            <input type="text" id="input-notes" placeholder="Optional">
        </div>

        <button class="btn-primary" onclick="addEntry()">Add</button>
    </div>

    <div class="toolbar">
        <button class="btn" onclick="sortByDate()">Sort by date</button>
        <button class="btn" onclick="collate()">Collate</button>
        <button class="btn" onclick="copyAsCSV()">Copy as CSV</button>
        <button class="btn btn-danger" onclick="clearAllEntries()">Clear all</button>
        <span class="copy-confirm" id="copy-confirm">Copied!</span>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Credit</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Notes</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="entries-tbody"></tbody>
        </table>
    </div>
</div>

<!-- ── Balance tab ── -->
<div class="page" id="page-balance">

    <div class="balance-grid">

        <!-- Cards -->
        <div class="balance-panel">
            <div class="balance-panel-header">
                <h2>Cards</h2>
                <span id="cards-total">£0.00</span>
            </div>
            <div class="balance-add-row">
                <input type="text" id="card-name" placeholder="Card name">
                <div class="amount-wrap">
                    <span class="pound-sign">£</span>
                    <input type="number" id="card-amount" min="0" step="0.01" placeholder="0.00">
                </div>
                <button class="btn-add-small" onclick="addCard()">Add</button>
            </div>
            <ul class="balance-list" id="cards-list"></ul>
        </div>

        <!-- Pending payments -->
        <div class="balance-panel">
            <div class="balance-panel-header">
                <h2>Pending Payments</h2>
                <span id="pending-total">£0.00</span>
            </div>
            <div class="balance-add-row">
                <input type="text" id="pending-name" placeholder="Payment name">
                <div class="amount-wrap">
                    <span class="pound-sign">£</span>
                    <input type="number" id="pending-amount" min="0" step="0.01" placeholder="0.00">
                </div>
                <button class="btn-add-small" onclick="addPending()">Add</button>
            </div>
            <ul class="balance-list" id="pending-list"></ul>
        </div>

    </div>

    <!-- Summary -->
    <div class="summary-card">
        <h2>Summary</h2>
        <div class="summary-row">
            <span class="label">Total in cards</span>
            <span class="value positive" id="summary-cards">£0.00</span>
        </div>
        <div class="summary-row">
            <span class="label">Pending payments</span>
            <span class="value negative" id="summary-pending">−£0.00</span>
        </div>
        <hr class="summary-divider">
        <div class="summary-total">
            <span class="label">Available</span>
            <span class="value neutral" id="summary-available">£0.00</span>
        </div>
        <hr class="summary-divider">
        <div class="summary-row">
            <span class="label">Spreadsheet says</span>
            <div class="spreadsheet-input-wrap">
                <span class="pound-sign-inline">£</span>
                <input type="number" id="spreadsheet-value" min="0" step="0.01" placeholder="0.00" oninput="onSpreadsheetChange()">
            </div>
        </div>
        <div class="summary-row">
            <span class="label">Difference</span>
            <span class="value" id="summary-diff">—</span>
        </div>
    </div>

</div>

<script>
    // ── State ──
    let entries = load('expense-entries');
    let cards   = load('balance-cards');
    let pending = load('balance-pending');

    // ── Init ──
    document.getElementById('input-date').valueAsDate = new Date();

    const savedSS = localStorage.getItem('spreadsheet-balance');
    if (savedSS) document.getElementById('spreadsheet-value').value = savedSS;

    renderEntries();
    renderBalance();

    // ── Tab switching ──
    function switchTab(name) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + name).classList.add('active');
        event.target.classList.add('active');
    }

    // ── Expenses ──
    function addEntry() {
        const credit    = document.getElementById('input-credit').checked;
        const category  = document.getElementById('input-category').value.trim();
        const amountRaw = document.getElementById('input-amount').value;
        const date      = document.getElementById('input-date').value;
        const notes     = document.getElementById('input-notes').value.trim();

        if (!amountRaw || !date) { alert('Amount and date are required.'); return; }

        entries.push({
            credit,
            category: category || 'Other',
            amount: parseFloat(amountRaw).toFixed(2),
            date,
            notes
        });

        save('expense-entries', entries);
        renderEntries();
        document.getElementById('input-credit').checked = false;
        document.getElementById('input-amount').value   = '';
        document.getElementById('input-notes').value    = '';
    }

    function deleteEntry(index) {
        entries.splice(index, 1);
        save('expense-entries', entries);
        renderEntries();
    }

    function sortByDate() {
        entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        save('expense-entries', entries);
        renderEntries();
    }

    function collate() {
        const groups = {};

        for (const entry of entries) {
            const key = `${entry.date}|${entry.category}`;
            if (!groups[key]) groups[key] = { ...entry, amount: 0, notes: [] };
            groups[key].amount += parseFloat(entry.amount);
            if (entry.notes) groups[key].notes.push(entry.notes);
        }

        entries = Object.values(groups).map(g => ({
            ...g,
            amount: g.amount.toFixed(2),
            notes: g.notes.join(', ')
        }));

        save('expense-entries', entries);
        renderEntries();
    }

    function copyAsCSV() {
        if (entries.length === 0) return;

        const tsv = entries
            .map(e => [e.credit ? 'Yes' : 'No', e.category, e.amount, formatDate(e.date), e.notes].join('\t'))
            .join('\n');

        navigator.clipboard.writeText(tsv).then(() => {
            const notice = document.getElementById('copy-confirm');
            notice.classList.add('visible');
            setTimeout(() => notice.classList.remove('visible'), 2000);
        });
    }

    function clearAllEntries() {
        if (!confirm('Clear all entries?')) return;
        entries = [];
        save('expense-entries', entries);
        renderEntries();
    }

    function renderEntries() {
        const tbody = document.getElementById('entries-tbody');
        if (entries.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No entries yet</td></tr>';
            return;
        }

        tbody.innerHTML = entries.map((e, i) => `
            <tr>
                <td><span class="badge ${e.credit ? 'badge-yes' : 'badge-no'}">${e.credit ? 'Yes' : 'No'}</span></td>
                <td>${e.category}</td>
                <td class="col-amount">£${e.amount}</td>
                <td>${formatDate(e.date)}</td>
                <td>${e.notes}</td>
                <td><button class="btn-delete" onclick="deleteEntry(${i})" title="Remove">×</button></td>
            </tr>
        `).join('');
    }

    // ── Balance ──
    function addCard() {
        const name   = document.getElementById('card-name').value.trim();
        const amount = document.getElementById('card-amount').value;
        if (!name || !amount) return;

        cards.push({ name, amount: parseFloat(amount).toFixed(2) });
        save('balance-cards', cards);
        renderBalance();
        document.getElementById('card-name').value   = '';
        document.getElementById('card-amount').value = '';
    }

    function addPending() {
        const name   = document.getElementById('pending-name').value.trim();
        const amount = document.getElementById('pending-amount').value;
        if (!name || !amount) return;

        pending.push({ name, amount: parseFloat(amount).toFixed(2) });
        save('balance-pending', pending);
        renderBalance();
        document.getElementById('pending-name').value   = '';
        document.getElementById('pending-amount').value = '';
    }

    function deleteCard(index) {
        cards.splice(index, 1);
        save('balance-cards', cards);
        renderBalance();
    }

    function deletePending(index) {
        pending.splice(index, 1);
        save('balance-pending', pending);
        renderBalance();
    }

    function renderBalance() {
        const cardTotal    = cards.reduce((sum, c) => sum + parseFloat(c.amount), 0);
        const pendingTotal = pending.reduce((sum, p) => sum + parseFloat(p.amount), 0);
        const available    = cardTotal - pendingTotal;

        // Cards list
        const cardsList = document.getElementById('cards-list');
        cardsList.innerHTML = cards.length === 0
            ? '<li class="balance-empty">No cards added</li>'
            : cards.map((c, i) => `
                <li>
                    <span class="item-name">${c.name}</span>
                    <span class="item-right">
                        <span class="item-amount">£${c.amount}</span>
                        <button class="btn-delete" onclick="deleteCard(${i})">×</button>
                    </span>
                </li>`).join('');

        // Pending list
        const pendingList = document.getElementById('pending-list');
        pendingList.innerHTML = pending.length === 0
            ? '<li class="balance-empty">No pending payments</li>'
            : pending.map((p, i) => `
                <li>
                    <span class="item-name">${p.name}</span>
                    <span class="item-right">
                        <span class="item-amount">£${p.amount}</span>
                        <button class="btn-delete" onclick="deletePending(${i})">×</button>
                    </span>
                </li>`).join('');

        // Totals in panel headers
        document.getElementById('cards-total').textContent   = fmt(cardTotal);
        document.getElementById('pending-total').textContent = fmt(pendingTotal);

        // Summary
        document.getElementById('summary-cards').textContent     = fmt(cardTotal);
        document.getElementById('summary-pending').textContent   = '−' + fmt(pendingTotal);
        const availEl = document.getElementById('summary-available');
        availEl.textContent  = fmt(available);
        availEl.className    = 'value ' + (available >= 0 ? 'positive' : 'negative');

        updateDiff(available);
    }

    function onSpreadsheetChange() {
        const raw = parseFloat(document.getElementById('spreadsheet-value').value);
        save('spreadsheet-balance', isNaN(raw) ? '' : raw);
        const cardTotal    = cards.reduce((sum, c) => sum + parseFloat(c.amount), 0);
        const pendingTotal = pending.reduce((sum, p) => sum + parseFloat(p.amount), 0);
        updateDiff(cardTotal - pendingTotal);
    }

    function updateDiff(available) {
        const input   = document.getElementById('spreadsheet-value');
        const diffEl  = document.getElementById('summary-diff');
        const ssValue = parseFloat(input.value);

        if (isNaN(ssValue)) {
            diffEl.textContent = '—';
            diffEl.className   = 'value';
            return;
        }

        const diff = available - ssValue;
        diffEl.textContent = (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff));
        diffEl.className   = 'value ' + (Math.abs(diff) < 0.01 ? 'positive' : 'negative');
    }

    // ── Helpers ──
    function formatDate(isoDate) {
        const [year, month, day] = isoDate.split('-');
        return `${day}/${month}/${year}`;
    }

    function fmt(n) {
        return '£' + Math.abs(n).toFixed(2);
    }

    function save(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }

    function load(key) {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : [];
    }
</script>

</body>
</html>
